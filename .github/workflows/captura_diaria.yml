name: Captura diaria TDL

# Horario: 03:00 UTC = 21:00 en Colima (UTC-6; México no usa horario de verano desde 2022).
# Si el gobierno restableciera el horario de verano, la hora local cambiaría una hora.
# Nota: GitHub solo ejecuta 'schedule' desde la rama por defecto y puede retrasarse minutos.
on:
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:
    inputs:
      fecha:
        description: "Fecha a capturar AAAA-MM-DD (vacío = ayer en Colima)"
        required: false
        default: ""

# Evita ejecuciones simultáneas del mismo pipeline (y conflictos de push).
concurrency:
  group: captura-tdl
  cancel-in-progress: false

# Permisos mínimos: solo escribir contenido para publicar los datos con GITHUB_TOKEN.
permissions:
  contents: write

jobs:
  captura:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Instalar dependencias
        run: python -m pip install -r requirements.txt

      - name: Pruebas unitarias (sin red)
        id: pruebas
        run: python -m pytest -q

      - name: Captura diaria
        id: captura
        env:
          FECHA: ${{ github.event.inputs.fecha }}
        run: |
          set +e
          if [ -n "$FECHA" ]; then python scripts/captura_diaria.py --fecha "$FECHA"; else python scripts/captura_diaria.py; fi
          code=$?
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
          exit 0   # el resultado se evalúa al final, después de guardar la evidencia

      - name: Pipeline E1 (Bronce → Plata → Oro)
        run: python main.py capas

      - name: Validar Capa Bronce (SHA-256 y manifiestos)
        id: validar
        continue-on-error: true
        run: python scripts/validar_bronce.py

      - name: Resumen de la ejecución
        if: always()
        run: |
          {
            echo "## Captura diaria TDL"
            echo "- Código de salida de la captura: \`${{ steps.captura.outputs.exit_code }}\` (0 exitosa/sin resultados, 1 fallida, 2 parcial)"
            echo "- Validación de Bronce: \`${{ steps.validar.outcome }}\`"
            python - <<'PY'
          import glob, json, os
          for fuente in ("sniim", "noaa_ncei"):
              ms = sorted(glob.glob(f"data/bronce/{fuente}/manifests/manifest_*.json"))
              if ms:
                  m = json.load(open(ms[-1], encoding="utf-8"))
                  print(f"- {fuente}: estado **{m['estado']}**, registros {m['registros']}, archivos {m['archivos_generados']}, errores {len(m['errores'])}")
          PY
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Publicar datos y manifiestos en el repositorio
        if: always() && steps.validar.outcome == 'success'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/ calidad/bitacora_capturas.csv
          if git diff --cached --quiet; then
            echo "Sin cambios que publicar"
          else
            git commit -m "datos: captura diaria $(date -u +%F) [skip ci]"
            git pull --rebase origin "${GITHUB_REF_NAME}"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi

      - name: Guardar logs como artefacto
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: logs-captura-${{ github.run_id }}
          path: logs/
          if-no-files-found: warn
          retention-days: 30

      - name: Fallar el job si la captura o la validación no fueron correctas
        if: always()
        run: |
          if [ "${{ steps.pruebas.outcome }}" != "success" ]; then
            echo "::error::Las pruebas unitarias fallaron o no se ejecutaron"; exit 1
          fi
          if [ "${{ steps.captura.outcome }}" != "success" ]; then
            echo "::error::El paso de captura no se ejecutó correctamente"; exit 1
          fi
          if [ "${{ steps.captura.outputs.exit_code }}" != "0" ]; then
            echo "::error::La captura terminó con código ${{ steps.captura.outputs.exit_code }}"; exit 1
          fi
          if [ "${{ steps.validar.outcome }}" != "success" ]; then
            echo "::error::La validación de la Capa Bronce falló"; exit 1
          fi

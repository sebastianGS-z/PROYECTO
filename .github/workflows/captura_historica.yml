name: Captura histórica TDL (manual)

# Descarga la serie histórica (por defecto, 36 meses completos) en la nube.
# Alternativa: ejecutar `python main.py historica` en tu computadora y hacer commit de data/ y calidad/.
# Si el SNIIM bloquea las IPs de GitHub, la ejecución quedará registrada como fallida (no se inventan datos).
on:
  workflow_dispatch:
    inputs:
      inicio:
        description: "AAAA-MM-DD (vacío = últimos 36 meses completos)"
        required: false
        default: ""
      fin:
        description: "AAAA-MM-DD (vacío = último día del mes anterior)"
        required: false
        default: ""
      solo:
        description: "Limitar a una fuente"
        required: false
        default: "ambas"
        type: choice
        options: [ambas, sniim, clima]

concurrency:
  group: captura-tdl
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  historica:
    runs-on: ubuntu-latest
    timeout-minutes: 340
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: python -m pip install -r requirements.txt
      - name: Pruebas unitarias (sin red)
        run: python -m pytest -q

      - name: Captura histórica
        id: captura
        env:
          INICIO: ${{ github.event.inputs.inicio }}
          FIN: ${{ github.event.inputs.fin }}
          SOLO: ${{ github.event.inputs.solo }}
        run: |
          set +e
          args=()
          [ -n "$INICIO" ] && args+=(--inicio "$INICIO")
          [ -n "$FIN" ] && args+=(--fin "$FIN")
          [ "$SOLO" != "ambas" ] && [ -n "$SOLO" ] && args+=(--solo "$SOLO")
          python scripts/captura_historica.py "${args[@]}"
          echo "exit_code=$?" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Validar Capa Bronce
        id: validar
        continue-on-error: true
        run: python scripts/validar_bronce.py

      - name: Publicar datos, cobertura y bitácora
        if: always() && steps.validar.outcome == 'success'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/ calidad/bitacora_capturas.csv
          if git diff --cached --quiet; then echo "Sin cambios"; else
            git commit -m "datos: captura histórica $(date -u +%F) [skip ci]"
            git pull --rebase origin "${GITHUB_REF_NAME}"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: logs-historica-${{ github.run_id }}
          path: logs/
          if-no-files-found: warn

      - name: Resultado
        if: always()
        run: |
          echo "Código de la captura: ${{ steps.captura.outputs.exit_code }} (0 ok, 1 fallida, 2 parcial: revise el reporte de cobertura)"
          [ "${{ steps.captura.outputs.exit_code }}" = "1" ] && { echo "::error::Captura histórica fallida"; exit 1; }
          [ "${{ steps.validar.outcome }}" != "success" ] && { echo "::error::Validación de Bronce falló"; exit 1; }
          exit 0
